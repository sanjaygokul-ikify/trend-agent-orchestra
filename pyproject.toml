[build-system]
requires = [
  "poetry-core>=1.0.0",
  "setuptools>=67.0.0",
  "wheel"
]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "agent-orchestra"
version = "0.1.0"
description = "Distributed agent orchestration framework"
authors = ["Your Org <dev@agentorchestra.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.9"
paxos = "^1.2.4"
grpc = "^1.50.0"
asyncpg = "^0.25.0"
redis = "^4.5.4"
pytest = "^7.2.0"